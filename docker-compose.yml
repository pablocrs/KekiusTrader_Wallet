version: '3.8'

services:
  wallet:
    build: .
    container_name: kekius_wallet
    env_file:
      - ./.env
    ports:
      - "8003:8003"
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - SOLANA_WS_URL=${SOLANA_WS_URL:-wss://api.mainnet-beta.solana.com}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - COLD_WALLET_ADDRESS=${COLD_WALLET_ADDRESS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_SLIPPAGE_BPS=${DEFAULT_SLIPPAGE_BPS:-100}
      - DEFAULT_SPEED_MODE=${DEFAULT_SPEED_MODE:-ULTRA_FAST}
      - ENABLE_AUTO_PROFIT_CONVERSION=${ENABLE_AUTO_PROFIT_CONVERSION:-true}
      - PROFIT_THRESHOLD_SOL=${PROFIT_THRESHOLD_SOL:-0.1}
      - AUTO_TRANSFER_TO_COLD_WALLET=${AUTO_TRANSFER_TO_COLD_WALLET:-true}
      - TRANSFER_THRESHOLD_USDC=${TRANSFER_THRESHOLD_USDC:-10.0}
      - WALLET_BALANCE_CACHE_TTL=${WALLET_BALANCE_CACHE_TTL:-20}
      - TOKEN_ACCOUNTS_CACHE_TTL=${TOKEN_ACCOUNTS_CACHE_TTL:-30}
      - RPC_RATE_LIMIT_COOLDOWN_SEC=${RPC_RATE_LIMIT_COOLDOWN_SEC:-45}
      - JUPITER_API_URL=${JUPITER_API_URL:-https://lite-api.jup.ag/swap/v1}
      - JUPITER_API_FALLBACK_URL=${JUPITER_API_FALLBACK_URL:-https://api.jup.ag/swap/v1}
      - JUPITER_API_KEY=${JUPITER_API_KEY:-}
      - JUPITER_PRICE_API_URL=${JUPITER_PRICE_API_URL:-https://lite-api.jup.ag/price/v3}
    restart: unless-stopped
    networks:
      - kekius-network

networks:
  kekius-network:
    external: true
